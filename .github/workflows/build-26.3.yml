# Builds the Minecraft 26.3 (Fabric) jar of this unofficial 1.5.0-beta backport.
# Only 26.3-fabric is configured (the full Stonecutter version list is trimmed in the
# runner's checkout), which keeps the build fast. The source in the repository is unchanged.
name: Build 26.3 (Fabric)

# Started by hand only (Actions -> Run workflow): no builds on push or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure only Minecraft 26.3 (Fabric)
        run: |
          perl -0pi -e 's/^[ \t]*mc\(".*\n//mg; s/^([ \t]*)vcsVersion/$1mc("26.3", "fabric")\n\n$1vcsVersion/m' settings.gradle.kts
          grep -n 'mc("' settings.gradle.kts

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :26.3-fabric:assemble --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: perspective-api-26.3-fabric
          path: versions/26.3-fabric/build/libs/*.jar
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: 'versions/26.3-fabric/build/libs/*.jar'
